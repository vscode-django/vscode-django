name: Update the built-in tags and filters

# Reads the Django docs every Friday and opens a pull request when the grammar and the links
# to the docs are out of date: see syntaxes/update_builtins.py. Nothing is changed at release time,
# so a release always contains what is in the repository.
on:
  schedule:
    - cron: "0 5 * * 5" # Fridays, 05:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-builtins
  cancel-in-progress: false

jobs:
  update:
    name: Update from the Django docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the branch
      pull-requests: write # to open the pull request
    env:
      BRANCH: update-django-builtins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tomlkit, at the version of uv.lock, is the only dependency of the script
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet tomlkit==0.15.2

      - run: $RUNNER_TEMP/venv/bin/python syntaxes/update_builtins.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Everything is up to date."
            exit 0
          fi
          version=$(jq -r .version data/django-docs.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add --all syntaxes data
          git commit --message "⬆️ Update the built-in tags and filters to Django $version" \
            --message "Generated by syntaxes/update_builtins.py from the Django documentation."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --json number --jq length)" = "0" ]; then
            gh pr create --head "$BRANCH" --base "${GITHUB_REF_NAME}" \
              --title "⬆️ Update the built-in tags and filters to Django $version" \
              --body "Generated by \`uv run syntaxes/update_builtins.py\` from the [Django documentation](https://docs.djangoproject.com/en/stable/). Review the added names, then merge. The checks do not run on pull requests opened by a workflow: run \`yarn test\` locally or close and reopen the pull request."
          fi
